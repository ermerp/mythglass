services:
  mythglass:
    build: .
    image: mythglass:latest
    container_name: mythglass
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Read-only: Die Anwendung liest die Bibliothek nur. Sie kann die Bilder des Spielleiters
      # damit gar nicht beschädigen — auch nicht bei einem Fehler im Code.
      - /srv/mythglass/library:/data/library:ro
      # Beschreibbar, enthält nur erzeugte Vorschaubilder. Darf jederzeit gelöscht werden.
      - /srv/mythglass/cache:/data/cache
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
